<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" font-family="Nunito, sans-serif"><g data-hl="sq"><rect x="40" y="30" width="100" height="100" fill="#D9E8F7" stroke="#2F5F8F" stroke-width="2"/><text x="90" y="146" font-size="12" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">10 × 10</text></g><g data-hl="re"><rect x="40" y="50" width="120" height="80" fill="none" stroke="#C24E32" stroke-width="3"/><text x="150" y="46" font-size="12" font-weight="800" fill="#C24E32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">8 × 12</text></g><g data-s="d"><rect x="40" y="30" width="100" height="20" fill="#B98A10" stroke="#3E3129" stroke-width="1"/><text x="200" y="44" font-size="11" font-weight="800" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">top strip: 10 × 2 = 20</text></g><g data-s="d"><rect x="140" y="50" width="20" height="80" fill="#D8EFD0" stroke="#3E3129" stroke-width="1"/><text x="200" y="96" font-size="11" font-weight="800" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">side strip: 2 × 8 = 16</text></g><g data-s="d"><text x="200" y="126" font-size="13" font-weight="800" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">20 − 16 = 4</text></g></svg>
