<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" font-family="Nunito,sans-serif" font-weight="900">
<rect width="320" height="260" fill="#FFFBF2"/><defs><marker id="dc_a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6A5B50"/></marker></defs><g data-s="d1 d2 d3 d4 d5"><rect x="40" y="12" width="240" height="34" rx="17" fill="#F2D38E" stroke="#8A6410" stroke-width="1.5"/><text x="160" y="34" text-anchor="middle" font-size="12.5" fill="#3E3129">Little or no rain for a long time</text></g><g data-s="d2 d3 d4 d5"><rect x="40" y="62" width="240" height="34" rx="17" fill="#F7C98B" stroke="#8A6410" stroke-width="1.5"/><text x="160" y="84" text-anchor="middle" font-size="12.5" fill="#3E3129">Crops fail, streams dry up</text><path d="M160 47L160 59" stroke="#6A5B50" stroke-width="3" marker-end="url(#dc_a)"/></g><g data-s="d3 d4 d5"><rect x="40" y="112" width="240" height="34" rx="17" fill="#F2A48A" stroke="#8A6410" stroke-width="1.5"/><text x="160" y="134" text-anchor="middle" font-size="12.5" fill="#3E3129">No pasture or water: livestock die</text><path d="M160 97L160 109" stroke="#6A5B50" stroke-width="3" marker-end="url(#dc_a)"/></g><g data-s="d4 d5"><rect x="40" y="162" width="240" height="34" rx="17" fill="#E88E6A" stroke="#8A6410" stroke-width="1.5"/><text x="160" y="184" text-anchor="middle" font-size="12.5" fill="#3E3129">Shortage of food, famine</text><path d="M160 147L160 159" stroke="#6A5B50" stroke-width="3" marker-end="url(#dc_a)"/></g><g data-s="d5"><rect x="40" y="212" width="240" height="34" rx="17" fill="#D6CFC4" stroke="#8A6410" stroke-width="1.5"/><text x="160" y="234" text-anchor="middle" font-size="12.5" fill="#3E3129">People displaced, move to towns</text><path d="M160 197L160 209" stroke="#6A5B50" stroke-width="3" marker-end="url(#dc_a)"/></g>
</svg>
