<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" font-family="Nunito,sans-serif" font-weight="900">
<rect width="320" height="250" fill="#FFFBF2"/><defs><marker id="fe_a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6A5B50"/></marker></defs><g data-s="r1 r2 r3"><rect x="100" y="14" width="120" height="40" rx="10" fill="#E9B949" stroke="#8A6410" stroke-width="2"/><text x="160" y="39" text-anchor="middle" font-size="14" fill="#3E3129">Landlord</text></g><g data-s="r1 r3"><rect x="10" y="190" width="110" height="40" rx="10" fill="#D6CFC4" stroke="#6A5B50" stroke-width="2"/><text x="65" y="215" text-anchor="middle" font-size="13" fill="#3E3129">Slave</text><path d="M65 186L65 150" stroke="#6A5B50" stroke-width="3" marker-end="url(#fe_a)"/><text x="72" y="172" font-size="10" fill="#6A5B50">given land</text><rect x="10" y="100" width="110" height="40" rx="10" fill="#F7C98B" stroke="#B98A1E" stroke-width="2"/><text x="65" y="125" text-anchor="middle" font-size="13" fill="#3E3129">Serf</text><path d="M80 96L125 60" stroke="#6A5B50" stroke-width="3" marker-end="url(#fe_a)"/></g><g data-s="r2 r3"><rect x="200" y="190" width="110" height="40" rx="10" fill="#CFE3A8" stroke="#2F6B3A" stroke-width="2"/><text x="255" y="215" text-anchor="middle" font-size="13" fill="#3E3129">Free farmer</text><path d="M255 186L255 150" stroke="#6A5B50" stroke-width="3" marker-end="url(#fe_a)"/><text x="190" y="172" font-size="10" fill="#6A5B50">needs protection</text><rect x="200" y="100" width="110" height="40" rx="10" fill="#8DB9E3" stroke="#1F6FB2" stroke-width="2"/><text x="255" y="125" text-anchor="middle" font-size="13" fill="#3E3129">Tenant</text><path d="M240 96L195 60" stroke="#6A5B50" stroke-width="3" marker-end="url(#fe_a)"/></g><g data-s="r3"><text x="160" y="84" text-anchor="middle" font-size="10" fill="#C23E33">work the lord's land</text><text x="160" y="98" text-anchor="middle" font-size="10" fill="#C23E33">and pay taxes</text></g>
