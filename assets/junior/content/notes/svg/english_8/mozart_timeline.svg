<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 394" font-family="Nunito, sans-serif"><!-- en8u9: timeline of Mozart's life (pp. 192-193) --><line x1="70" y1="16" x2="70" y2="384" stroke="#9C8B7C" stroke-width="3" stroke-linecap="round"/><g data-s="a b c d e f g"><circle cx="70" cy="30" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="35" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1756</text><text x="88" y="35" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Mozart was born</text></g><g data-s="b c d e f g"><circle cx="70" cy="82" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="87" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">age 5</text><text x="88" y="79" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">had already started</text><text x="88" y="96" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">writing songs</text></g><g data-s="c d e f g"><circle cx="70" cy="134" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="139" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">before 8</text><text x="88" y="131" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">had performed concerts in</text><text x="88" y="148" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Europe</text></g><g data-s="d e f g"><circle cx="70" cy="186" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="191" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">age 9</text><text x="88" y="191" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">wrote his first symphony</text></g><g data-s="e f g"><circle cx="70" cy="238" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="243" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">age 14</text><text x="88" y="235" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">stopped performing</text><text x="88" y="252" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">concerts</text></g><g data-s="f g"><circle cx="70" cy="290" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="295" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1773</text><text x="88" y="295" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">started to tour again</text></g><g data-s="g"><circle cx="70" cy="342" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="347" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1791</text><text x="88" y="347" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Mozart died</text></g></svg>
