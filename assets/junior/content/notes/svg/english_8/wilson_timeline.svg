<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 342" font-family="Nunito, sans-serif"><!-- en8u4: timeline of E. O. Wilson's life (pp. 81-82) --><line x1="70" y1="16" x2="70" y2="332" stroke="#9C8B7C" stroke-width="3" stroke-linecap="round"/><g data-s="a b c d e f"><circle cx="70" cy="30" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="35" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1929</text><text x="88" y="35" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">born in South Alabama, USA</text></g><g data-s="b c d e f"><circle cx="70" cy="82" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="87" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">age 7</text><text x="88" y="79" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">blinded in one eye in a</text><text x="88" y="96" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">fishing accident</text></g><g data-s="c d e f"><circle cx="70" cy="134" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="139" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1951</text><text x="88" y="139" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">joined Harvard University</text></g><g data-s="d e f"><circle cx="70" cy="186" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="191" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1984</text><text x="88" y="191" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">wrote the book Biophilia</text></g><g data-s="e f"><circle cx="70" cy="238" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="243" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">1992</text><text x="88" y="235" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">wrote The Diversity of</text><text x="88" y="252" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Life</text></g><g data-s="f"><circle cx="70" cy="290" r="9" fill="#FFDCD0" stroke="#C24E32" stroke-width="3"/><text x="56" y="295" font-size="14" font-weight="800" fill="#3E3129" text-anchor="end" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2007</text><text x="88" y="287" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">started the Encyclopedia</text><text x="88" y="304" font-size="14" font-weight="700" fill="#3E3129" text-anchor="start" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">of Life</text></g></svg>
