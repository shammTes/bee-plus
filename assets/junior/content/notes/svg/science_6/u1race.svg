<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="80" width="320" height="140" fill="#FFF4CC"/><path d="M0 150h320" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/><path d="M30 80v140M290 80v140" stroke="#A8412A" stroke-width="4"/><text x="30" y="236" font-size="11" fill="#A8412A" text-anchor="middle" >start</text><text x="290" y="236" font-size="11" fill="#A8412A" text-anchor="middle" >200 m</text><g data-s="r1"><g transform="translate(0 94)"><circle cx="40" cy="0" r="8" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2"/><path d="M40 8v18M40 26l-8 14M40 26l8 14M40 14l-10 6M40 14l10-4" stroke="#6A5B50" stroke-width="3"/></g><g transform="translate(0 164)"><circle cx="40" cy="0" r="8" fill="#FFC9BA" stroke="#6A5B50" stroke-width="2"/><path d="M40 8v18M40 26l-8 14M40 26l8 14M40 14l-10 6M40 14l10-4" stroke="#6A5B50" stroke-width="3"/></g><text x="160" y="40" font-size="14" fill="#6A5B50" text-anchor="middle" >A and B start together.</text></g><g data-s="r2"><g transform="translate(0 94)"><circle cx="280" cy="0" r="8" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2"/><path d="M280 8v18M280 26l-8 14M280 26l8 14M280 14l-10 6M280 14l10-4" stroke="#6A5B50" stroke-width="3"/></g><g transform="translate(0 164)"><circle cx="200" cy="0" r="8" fill="#FFC9BA" stroke="#6A5B50" stroke-width="2"/><path d="M200 8v18M200 26l-8 14M200 26l8 14M200 14l-10 6M200 14l10-4" stroke="#6A5B50" stroke-width="3"/></g><text x="160" y="40" font-size="14" fill="#5F90C4" text-anchor="middle" >A finishes in 2 minutes.</text></g><g data-s="r3"><g transform="translate(0 94)"><circle cx="280" cy="0" r="8" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2"/><path d="M280 8v18M280 26l-8 14M280 26l8 14M280 14l-10 6M280 14l10-4" stroke="#6A5B50" stroke-width="3"/></g><g transform="translate(0 164)"><circle cx="280" cy="0" r="8" fill="#FFC9BA" stroke="#6A5B50" stroke-width="2"/><path d="M280 8v18M280 26l-8 14M280 26l8 14M280 14l-10 6M280 14l10-4" stroke="#6A5B50" stroke-width="3"/></g><text x="160" y="40" font-size="14" fill="#D9765A" text-anchor="middle" >B finishes in 3 minutes.</text><text x="160" y="60" font-size="12" fill="#A8412A" text-anchor="middle" >A is faster: less time, same distance.</text></g><text x="10" y="112" font-size="14" fill="#5F90C4" text-anchor="start" >A</text><text x="10" y="182" font-size="14" fill="#D9765A" text-anchor="start" >B</text>
