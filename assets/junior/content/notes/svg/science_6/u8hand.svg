<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<circle cx="220" cy="46" r="26" fill="#FFC9BA" stroke="#D9765A" stroke-width="2.5"/><path d="M200 74q-10 60 0 150h50q10-90 0-150z" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2.5"/><path d="M200 90q-50 30-90 90" stroke="#FFC9BA" stroke-width="18" stroke-linecap="round" fill="none"/><path d="M200 90q-50 30-90 90" stroke="#D9765A" stroke-width="2" fill="none" stroke-dasharray="0"/><circle cx="104" cy="186" r="12" fill="#FFC9BA" stroke="#D9765A" stroke-width="2.5"/><rect x="92" y="212" width="16" height="28" fill="#FFF4CC" stroke="#DDA42A" stroke-width="2"/><path d="M100 212q-8-10 0-20q8 10 0 20z" fill="#FFE08A" stroke="#E4574A" stroke-width="2"/><ellipse cx="220" cy="42" rx="16" ry="12" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2"/><path d="M226 56v140" stroke="#6A4C9C" stroke-width="4"/><ellipse cx="160" cy="124" rx="18" ry="9" transform="rotate(-40 160 124)" fill="#E4574A" opacity=".6"/><g data-s="h1 h2 h3 h4 h5"><text x="60" y="20" font-size="1" fill="#6A5B50" text-anchor="middle" ></text></g><g data-s="h1"><text x="70" y="30" font-size="13" fill="#A8412A" text-anchor="middle" >1. Stimulus:</text><text x="70" y="46" font-size="13" fill="#A8412A" text-anchor="middle" >heat of the flame</text><g ><path d="M100.0 196.0L100.0 199.2" stroke="#A8412A" stroke-width="2" stroke-linecap="round"/><path d="M100.0 204.0L102.8 199.2L97.2 199.2Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g></g><g data-s="h2"><text x="70" y="30" font-size="13" fill="#DDA42A" text-anchor="middle" >2. Receptor:</text><text x="70" y="46" font-size="13" fill="#DDA42A" text-anchor="middle" >the skin of the hand</text><circle cx="104" cy="186" r="16" fill="none" stroke="#DDA42A" stroke-width="3"/></g><g data-s="h3"><path d="M110 176q40-60 90-86q20 -8 26 -34" stroke="#DDA42A" stroke-width="4" fill="none" stroke-dasharray="6 5"/><text x="70" y="30" font-size="13" fill="#6A4C9C" text-anchor="middle" >3. The signal goes</text><text x="70" y="46" font-size="13" fill="#6A4C9C" text-anchor="middle" >to the spinal cord</text><text x="70" y="62" font-size="13" fill="#6A4C9C" text-anchor="middle" >and brain</text></g><g data-s="h4"><path d="M226 60q-6 30-40 40q-20 8-26 24" stroke="#6A4C9C" stroke-width="4" fill="none" stroke-dasharray="6 5"/><text x="70" y="30" font-size="13" fill="#2F6B3A" text-anchor="middle" >4. Effector:</text><text x="70" y="46" font-size="13" fill="#2F6B3A" text-anchor="middle" >the arm muscle</text><text x="70" y="62" font-size="13" fill="#2F6B3A" text-anchor="middle" >contracts</text></g><g data-s="h5"><g ><path d="M110.0 170.0L143.2 136.8" stroke="#2F6B3A" stroke-width="4" stroke-linecap="round"/><path d="M150.0 130.0L139.3 132.8L147.2 140.7Z" fill="#2F6B3A" stroke="#2F6B3A" stroke-width="2" stroke-linejoin="round"/></g><text x="70" y="30" font-size="13" fill="#5F90C4" text-anchor="middle" >5. Response:</text><text x="70" y="46" font-size="13" fill="#5F90C4" text-anchor="middle" >the hand pulls away</text></g>
</svg>
