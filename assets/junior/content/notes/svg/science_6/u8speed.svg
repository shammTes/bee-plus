<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="plant"><path d="M140 186h60l-8 30h-44z" fill="#B8704F" stroke="#6A5B50" stroke-width="2"/><path d="M155 186q0 -40 20 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="175" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><path d="M170 186q0 -40 20 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="190" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><path d="M185 186q0 -40 20 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="205" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><text x="160" y="40" font-size="15" fill="#2F6B3A" text-anchor="middle" >PLANTS respond SLOWLY</text><text x="160" y="60" font-size="12" fill="#6A5B50" text-anchor="middle" >by growing, wilting or losing leaves</text><circle cx="270" cy="120" r="28" fill="#fff" stroke="#6A5B50" stroke-width="2.5"/><path d="M270 120v-18M270 120l12 8" stroke="#6A5B50" stroke-width="3" stroke-linecap="round"/><text x="270" y="170" font-size="11" fill="#6A5B50" text-anchor="middle" >hours or days</text></g><g data-s="animal"><g transform="translate(90 110)"><ellipse cx="0" cy="0" rx="40" ry="20" fill="#C9B49C" stroke="#B8704F" stroke-width="2.5"/><circle cx="42" cy="-14" r="14" fill="#C9B49C" stroke="#B8704F" stroke-width="2.5"/><path d="M36 -26l4 -14l8 12" fill="#C9B49C" stroke="#B8704F" stroke-width="2"/><path d="M-30 18v22M-10 18v22M10 18v22M30 18v22" stroke="#B8704F" stroke-width="4"/><circle cx="48" cy="-16" r="2.5" fill="#6A5B50"/></g><path d="M20 100h-30" stroke="#9C8A76" stroke-width="3" stroke-linecap="round"/><path d="M16 112h-24" stroke="#9C8A76" stroke-width="3" stroke-linecap="round"/><path d="M12 124h-18" stroke="#9C8A76" stroke-width="3" stroke-linecap="round"/><text x="160" y="40" font-size="15" fill="#6A4C9C" text-anchor="middle" >ANIMALS respond FAST</text><text x="160" y="60" font-size="12" fill="#6A5B50" text-anchor="middle" >by moving the body or a part of it</tex