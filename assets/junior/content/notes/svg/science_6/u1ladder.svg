A" stroke-width="2" stroke-linejoin="round"/></g><text x="220" y="90" font-size="13" fill="#A8412A" text-anchor="middle" >×60</text><circle cx="280" cy="120" r="23" fill="#DDEFD8" stroke="#2F6B3A" stroke-width="3"/><text x="280" y="126" font-size="16" fill="#2F6B3A" text-anchor="middle" >s</text><text x="160" y="40" font-size="14" fill="#2F6B3A" text-anchor="middle" >TIME: big unit → small unit</text><text x="160" y="190" font-size="11" fill="#6A5B50" text-anchor="middle" >1 h = 60 min, 1 min = 60 s</text><text x="160" y="208" font-size="11" fill="#6A5B50" text-anchor="middle" >1 day = 24 hours, 1 year = 365 days</text></g>
