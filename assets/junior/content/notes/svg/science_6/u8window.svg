<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="250" y="40" width="60" height="110" fill="#FFF4CC" stroke="#B8704F" stroke-width="4"/><path d="M280 40v110M250 95h60" stroke="#B8704F" stroke-width="3"/><path d="M250 70L210 90" stroke="#FFE08A" stroke-width="3" stroke-dasharray="6 4"/><path d="M250 90L210 114" stroke="#FFE08A" stroke-width="3" stroke-dasharray="6 4"/><path d="M250 110L210 138" stroke="#FFE08A" stroke-width="3" stroke-dasharray="6 4"/><text x="280" y="30" font-size="12" fill="#B8704F" text-anchor="middle" >window</text><rect x="0" y="236" width="320" height="4" fill="#C9B49C"/><g data-s="w1"><path d="M140 206h60l-8 30h-44z" fill="#B8704F" stroke="#6A5B50" stroke-width="2"/><path d="M155 206q0 -40 0 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="155" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><path d="M170 206q0 -40 0 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="170" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><path d="M185 206q0 -40 0 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="185" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><text x="90" y="60" font-size="13" fill="#6A5B50" text-anchor="middle" >Put straight</text><text x="90" y="76" font-size="13" fill="#6A5B50" text-anchor="middle" >seedlings near</text><text x="90" y="92" font-size="13" fill="#6A5B50" text-anchor="middle" >a window.</text></g><g data-s="w2"><path d="M140 206h60l-8 30h-44z" fill="#B8704F" stroke="#6A5B50" stroke-width="2"/><path d="M155 206q0 -40 26 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="181" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><path d="M170 206q0 -40 26 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="196" cy="136" rx="10" ry="6" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><path d="M185 206q0 -40 26 -70" stroke="#2F6B3A" stroke-width="4" fill="none"/><ellipse cx="211" cy="136" rx="10" ry=