<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="short"><circle cx="200" cy="130" r="56" fill="#F4F8FF" stroke="#9C8A76" stroke-width="3"/><path d="M206 78a52 52 0 0 1 0 104" fill="none" stroke="#E4574A" stroke-width="4"/><ellipse cx="160" cy="130" rx="7" ry="18" fill="#9CC0E6" stroke="#5F90C4" stroke-width="2"/><path d="M20 112H160L220 130L256 142" stroke="#DDA42A" stroke-width="2.5" fill="none"/><path d="M20 148H160L220 130L256 118" stroke="#DDA42A" stroke-width="2.5" fill="none"/><circle cx="220" cy="130" r="5" fill="#A8412A"/><text x="160" y="30" font-size="13" fill="#A8412A" text-anchor="middle" >SHORT sight: far things look blurred</text><text x="160" y="222" font-size="12" fill="#A8412A" text-anchor="middle" >light focuses IN FRONT of the retina</text></g><g data-s="shortfix"><circle cx="200" cy="130" r="56" fill="#F4F8FF" stroke="#9C8A76" stroke-width="3"/><path d="M206 78a52 52 0 0 1 0 104" fill="none" stroke="#E4574A" stroke-width="4"/><ellipse cx="160" cy="130" rx="7" ry="18" fill="#9CC0E6" stroke="#5F90C4" stroke-width="2"/><path d="M70 96h16q-8 34 0 68h-16q8-34 0-68z" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><path d="M20 116H78L160 106L256 130" stroke="#DDA42A" stroke-width="2.5" fill="none"/><path d="M20 144H78L160 154L256 130" stroke="#DDA42A" stroke-width="2.5" fill="none"/><circle cx="254" cy="130" r="5" fill="#2F6B3A"/><text x="160" y="30" font-size="13" fill="#2F6B3A" text-anchor="middle" >Fix: a CONCAVE (diverging) lens</text><text x="160" y="222" font-size="12" fill="#2F6B3A" text-anchor="middle" >now the image falls on the retina</text></g><g data-s="long"><circle cx="200" cy="130" r="56" fill="#F4F8FF" stroke="#9C8A76" stroke-width="3"/><path d="M206 78a52 52 0 0 1 0 104" fill="none" stroke="#E4574A" stroke-width="4"/><ellipse cx="160" cy="130" rx="7" ry="18" fill="#9CC0E6" stroke="#5F90C4" stroke-width="2"/><path d="M40 100L160 116L290 150" stroke="#DDA42A" stroke-width="2.5" fill="none"/><path d="M40 160L160 144L290 110" stroke="#DDA42A" stroke-width="2.5" fill="none"/><circle cx="286" cy="130" r="5" fill="#A8412A"/><text x="160" y="30" font-size="13" fill="#A8412A" text-anchor="middle" >LONG sight: near things look blurred</text><text x="160" y="222" font-size="12" fill="#A8412A" text-anchor="middle" >light focuses BEHIND the retina</text></g><g data-s="longfix"><circle cx="200" cy="130" r="56" fill="#F4F8FF" stroke="#9C8A76" stroke-width="3"/><path d="M206 78a52 52 0 0 1 0 104" fill="none" stroke="#E4574A" stroke-width="4"/><ellipse cx="160" cy="130" rx="7" ry="18" fill="#9CC0E6" stroke="#5F90C4" stroke-width="2"/><path d="M78 96q14 34 0 68q-14-34 0-68z" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><path d="M30 100L78 106L160 118L256 130" stroke="#DDA42A" stroke-width="2.5" fill="none"/><path d="M30 160L78 154L160 142L256 130" stroke="#DDA42A" stroke-width="2.5" fill="none"/><circle cx="254" cy="130" r="5" fill="#2F6B3A"/><text x="160" y="30" font-size="13" fill="#2F6B3A" text-anchor="middle" >Fix: a CONVEX (converging) lens</text><text x="160" y="222" font-size="12" fill="#2F6B3A" text-anchor="middle" >now the image falls on the retina</text></g>
