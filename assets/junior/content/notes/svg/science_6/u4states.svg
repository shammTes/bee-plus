<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="solid"><path d="M150 110v30l-30 60h80l-30-60v-30z" fill="#fff" stroke="#6A5B50" stroke-width="2.5"/><rect x="146" y="164" width="28" height="28" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><text x="160" y="44" font-size="18" fill="#DDA42A" text-anchor="middle" >SOLID</text><text x="160" y="66" font-size="12" fill="#6A5B50" text-anchor="middle" >definite shape, definite volume</text></g><g data-s="liquid"><path d="M150 110v30l-30 60h80l-30-60v-30z" fill="#fff" stroke="#6A5B50" stroke-width="2.5"/><path d="M136 176h48l12 24h-72z" fill="#9CC0E6"/><text x="160" y="44" font-size="18" fill="#5F90C4" text-anchor="middle" >LIQUID</text><text x="160" y="66" font-size="12" fill="#6A5B50" text-anchor="middle" >no definite shape, definite volume</text><text x="160" y="228" font-size="11" fill="#6A5B50" text-anchor="middle" >it takes the shape of the flask</text></g><g data-s="gas"><path d="M150 110v30l-30 60h80l-30-60v-30z" fill="#EAE0F7" stroke="#6A5B50" stroke-width="2.5"/><circle cx="155" cy="120" r="3" fill="#6A4C9C"/><circle cx="163" cy="134" r="3" fill="#6A4C9C"/><circle cx="150" cy="150" r="3" fill="#6A4C9C"/><circle cx="170" cy="158" r="3" fill="#6A4C9C"/><circle cx="140" cy="176" r="3" fill="#6A4C9C"/><circle cx="160" cy="182" r="3" fill="#6A4C9C"/><circle cx="182" cy="188" r="3" fill="#6A4C9C"/><circle cx="128" cy="194" r="3" fill="#6A4C9C"/><circle cx="152" cy="196" r="3" fill="#6A4C9C"/><text x="160" y="44" font-size="18" fill="#6A4C9C" text-anchor="middle" >GAS</text><text x="160" y="66" font-size="12" fill="#6A5B50" text-anchor="middle" >no definite shape, no definite volume</text><text x="160" y="228" font-size="11" fill="#6A5B50" text-anchor="middle" >it fills all the space</text></g>
