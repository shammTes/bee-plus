<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="190" width="320" height="50" fill="#B8704F"/><g data-s="static"><rect x="140" y="130" width="40" height="60" fill="#9CC0E6" stroke="#6A5B50" stroke-width="2.5"/><ellipse cx="160" cy="130" rx="20" ry="6" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2"/><text x="160" y="40" font-size="13" fill="#6A4C9C" text-anchor="middle" >STATIC friction: surfaces at rest</text><text x="160" y="60" font-size="11" fill="#6A5B50" text-anchor="middle" >(the can is not moving yet)</text></g><g data-s="slide"><rect x="180" y="130" width="40" height="60" fill="#9CC0E6" stroke="#6A5B50" stroke-width="2.5"/><ellipse cx="200" cy="130" rx="20" ry="6" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2"/><g ><path d="M60.0 160.0L160.4 160.0" stroke="#5F90C4" stroke-width="4" stroke-linecap="round"/><path d="M170.0 160.0L160.4 154.4L160.4 165.6Z" fill="#5F90C4" stroke="#5F90C4" stroke-width="2" stroke-linejoin="round"/></g><path d="M100 192h80" stroke="#A8412A" stroke-width="3" stroke-dasharray="6 4"/><text x="160" y="40" font-size="13" fill="#A8412A" text-anchor="middle" >SLIDING friction: one surface slides</text><text x="160" y="60" font-size="13" fill="#A8412A" text-anchor="middle" >over another</text></g><g data-s="roll"><rect x="170" y="150" width="60" height="40" fill="#9CC0E6" stroke="#6A5B50" stroke-width="2.5"/><ellipse cx="230" cy="170" rx="7" ry="20" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2"/><path d="M150 140a24 24 0 0 1 30 -4" stroke="#2F6B3A" stroke-width="3" fill="none"/><g ><path d="M60.0 170.0L150.4 170.0" stroke="#5F90C4" stroke-width="4" stroke-linecap="round"/><path d="M160.0 170.0L150.4 164.4L150.4 175.6Z" fill="#5F90C4" stroke="#5F90C4" stroke-width="2" stroke-linejoin="round"/></g><text x="160" y="40" font-size="13" fill="#2F6B3A" text-anchor="middle" >ROLLING friction: the can rolls</text><text x="160" y="60" font-size="11" fill="#6A5B50" text-anchor="middle" >(much less than sliding)</text></g>
</svg>
