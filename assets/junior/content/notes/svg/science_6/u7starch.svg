<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="a1"><rect x="100" y="120" width="120" height="70" fill="#9CC0E6" stroke="#6A5B50" stroke-width="2.5"/><path d="M110 120q10-20 0-40M160 120q10-20 0-40M210 120q10-20 0-40" stroke="#9C8A76" stroke-width="3" fill="none"/><ellipse cx="160" cy="160" rx="30" ry="12" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2"/><text x="160" y="40" font-size="12" fill="#6A5B50" text-anchor="middle" >1. Boil the leaf for 5 minutes to soften it.</text><text x="160" y="216" font-size="12" fill="#5F90C4" text-anchor="middle" >boiling water</text></g><g data-s="a2"><rect x="100" y="120" width="120" height="70" fill="#9CC0E6" stroke="#6A5B50" stroke-width="2.5"/><path d="M150 80v90q0 12 10 12t10-12v-90" fill="#E8F6E0" stroke="#6A5B50" stroke-width="2"/><path d="M156 110q4-20 8 0z" fill="#5CA75C"/><text x="160" y="34" font-size="12" fill="#6A5B50" text-anchor="middle" >2. Put it in ethanol, in hot water,</text><text x="160" y="50" font-size="12" fill="#6A5B50" text-anchor="middle" >for 10 minutes. The green comes out.</text><text x="160" y="216" font-size="12" fill="#A8412A" text-anchor="middle" >no flame near ethanol!</text></g><g data-s="a3"><rect x="90" y="150" width="140" height="40" rx="6" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><ellipse cx="160" cy="136" rx="36" ry="12" fill="#E8F0C8" stroke="#2F6B3A" stroke-width="2"/><text x="160" y="40" font-size="12" fill="#6A5B50" text-anchor="middle" >3. Wash it in cold water.</text></g><g data-s="a4"><rect x="80" y="170" width="160" height="12" fill="#fff" stroke="#9C8A76" stroke-width="2"/><ellipse cx="160" cy="160" rx="50" ry="14" fill="#E8F0C8" stroke="#2F6B3A" stroke-width="2"/><path d="M150 70h20v40l-10 14l-10-14z" fill="#DDA42A" stroke="#6A5B50" stroke-width="2"/><circle cx="160" cy="136" r="4" fill="#DDA42A"/><text x="160" y="40" font-size="12" fill="#6A5B50" text-anchor="middle" >4. Add 1 or 2 drops of iodine.</text><text x="160" y="216" font-size="12" fill="#A8412A" text-anchor="middle" >What colour change do you see?</text></g>
</svg>
