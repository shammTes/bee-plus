<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 150" font-family="Nunito,sans-serif" font-weight="900">
<rect width="320" height="150" fill="#FFFBF2"/><g data-s="st"><rect x="40" y="45" width="240" height="50" rx="10" fill="#D6E4F0"/><text x="160" y="77" text-anchor="middle" font-size="20" fill="#1F4E7A" font-weight="bold">1 cm to 1 km</text><text x="160" y="125" text-anchor="middle" font-size="13" fill="#1F4E7A">in words</text></g><g data-s="rf"><rect x="40" y="45" width="240" height="50" rx="10" fill="#F7E0B8"/><text x="160" y="77" text-anchor="middle" font-size="20" fill="#8A6410" font-weight="bold">1 : 100,000</text><text x="160" y="125" text-anchor="middle" font-size="13" fill="#8A6410">a ratio, same units</text></g><g data-s="gr"><rect x="60" y="60" width="50" height="12" fill="#3E3129" stroke="#3E3129" stroke-width="1.5"/><rect x="110" y="60" width="50" height="12" fill="#fff" stroke="#3E3129" stroke-width="1.5"/><rect x="160" y="60" width="50" height="12" fill="#3E3129" stroke="#3E3129" stroke-width="1.5"/><rect x="210" y="60" width="50" height="12" fill="#fff" stroke="#3E3129" stroke-width="1.5"/><text x="60" y="92" text-anchor="middle" font-size="12" fill="#3E3129">0</text><text x="110" y="92" text-anchor="middle" font-size="12" fill="#3E3129">10</text><text x="160" y="92" text-anchor="middle" font-size="12" fill="#3E3129">20</text><text x="210" y="92" text-anchor="middle" font-size="12" fill="#3E3129">30</text><text x="260" y="92" text-anchor="middle" font-size="12" fill="#3E3129">40</text><text x="290" y="92" text-anchor="start" font-size="11" fill="#3E3129">km</text><text x="160" y="125" text-anchor="middle" font-size="13" fill="#3E3129">a short graph</text></g>
</svg>
