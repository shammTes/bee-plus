<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 230" font-family="Nunito, sans-serif"><!-- m8u12: a coin has 2 faces and a die has 6 faces (p. 162) --><circle cx="80" cy="100" r="55" fill="#FFEEBF" stroke="#B98A10" stroke-width="3"/><text x="80" y="96" font-size="16" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">head</text><text x="80" y="118" font-size="14" font-weight="800" fill="#9C8B7C" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">or tail</text><rect x="180" y="45" width="110" height="110" rx="16" fill="#FFFFFF" stroke="#3E3129" stroke-width="3"/><circle cx="205" cy="70" r="9" fill="#3E3129" stroke="#3E3129" stroke-width="1"/><circle cx="265" cy="70" r="9" fill="#3E3129" stroke="#3E3129" stroke-width="1"/><circle cx="235" cy="100" r="9" fill="#3E3129" stroke="#3E3129" stroke-width="1"/><circle cx="205" cy="130" r="9" fill="#3E3129" stroke="#3E3129" stroke-width="1"/><circle cx="265" cy="130" r="9" fill="#3E3129" stroke="#3E3129" stroke-width="1"/><text x="80" y="185" font-size="15" font-weight="800" fill="#B98A10" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2 faces</text><text x="235" y="185" font-size="15" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">6 faces</text><text x="80" y="210" font-size="15" font-weight="800" fill="#2A7A6B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">P(head) = 1/2</text><text x="235" y="210" font-size="15" font-weight="800" fill="#2A7A6B" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">P(5) = 1/6</text></svg>
