<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 225" font-family="Nunito, sans-serif"><!-- m8u5: power form and logarithm form (p. 62) --><rect x="20" y="30" width="130" height="70" rx="16" fill="#FFEEBF" stroke="#B98A10" stroke-width="3"/><rect x="190" y="30" width="130" height="70" rx="16" fill="#D9E8F7" stroke="#2F5F8F" stroke-width="3"/><text x="85" y="76" font-size="26" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">2⁴ = 16</text><text x="255" y="76" font-size="22" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">log₂16 = 4</text><text x="85" y="124" font-size="14" font-weight="800" fill="#B98A10" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">power form</text><text x="255" y="124" font-size="14" font-weight="800" fill="#2F5F8F" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">log form</text><line x1="152" y1="55" x2="178" y2="55" stroke="#2A7A6B" stroke-width="3" stroke-linecap="round"/><polygon points="188,55 178,60.5 178,49.5" fill="#2A7A6B" stroke="#2A7A6B" stroke-width="1" stroke-linejoin="round"/><line x1="188" y1="80" x2="162" y2="80" stroke="#2A7A6B" stroke-width="3" stroke-linecap="round"/><polygon points="152,80 162,74.5 162,85.5" fill="#2A7A6B" stroke="#2A7A6B" stroke-width="1" stroke-linejoin="round"/><text x="170" y="158" font-size="15" font-weight="800" fill="#C24E32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">base: 2 in both forms</text><text x="170" y="182" font-size="15" font-weight="800" fill="#3D7A47" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">exponent 4 = the answer of the log</text><text x="170" y="210" font-size="16" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">The log is the exponent.</text></svg>
