<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" font-family="Nunito, sans-serif"><!-- m8u2: rectangular garden, length twice the width (p. 28) --><rect x="40" y="50" width="240" height="120" rx="6" fill="#D3F1EA" stroke="#2A7A6B" stroke-width="3"/><g data-s="l"><line x1="40" y1="50" x2="160" y2="50" stroke="#C24E32" stroke-width="5" stroke-linecap="round"/><line x1="160" y1="50" x2="280" y2="50" stroke="#2F5F8F" stroke-width="5" stroke-linecap="round"/></g><g data-s="w"><line x1="280" y1="50" x2="280" y2="170" stroke="#C24E32" stroke-width="5" stroke-linecap="round"/></g><text x="160" y="118" font-size="18" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">Area = 32 m²</text><g data-s="l"><text x="160" y="36" font-size="16" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">length l = 2w</text></g><g data-s="w"><text x="300" y="115" font-size="18" font-weight="800" fill="#3E3129" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">w</text></g><g data-s="ans"><text x="160" y="200" font-size="17" font-weight="800" fill="#C24E32" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4" stroke-linejoin="round">w = 4 m,  l = 8 m</text></g></svg>
