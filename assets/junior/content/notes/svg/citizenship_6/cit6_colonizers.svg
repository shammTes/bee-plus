<rect x="0" y="0" width="320" height="240" fill="#FFFBF2"/><text x="160" y="30" font-size="13" fill="#D9765A" text-anchor="middle" >Eritrea was colonized by five countries</text><rect x="20" y="52" width="88" height="68" rx="12" fill="#FFC9BA" stroke="#6A5B50" stroke-width="2.5"/><text x="64.0" y="90.33333333333333" font-size="13" fill="#6A5B50" text-anchor="middle" >Turkey</text><rect x="116" y="52" width="88" height="68" rx="12" fill="#FFE08A" stroke="#6A5B50" stroke-width="2.5"/><text x="160.0" y="90.33333333333333" font-size="13" fill="#6A5B50" text-anchor="middle" >Egypt</text><rect x="212" y="52" width="88" height="68" rx="12" fill="#DDEFD8" stroke="#6A5B50" stroke-width="2.5"/><text x="256.0" y="90.33333333333333" font-size="13" fill="#6A5B50" text-anchor="middle" >Italy</text><rect x="68" y="136" width="88" height="68" rx="12" fill="#D9E8F7" stroke="#6A5B50" stroke-width="2.5"/><text x="112.0" y="174.33333333333334" font-size="13" fill="#6A5B50" text-anchor="middle" >Britain</text><rect x="164" y="136" width="88" height="68" rx="12" fill="#EAE0F7" stroke="#6A5B50" stroke-width="2.5"/><text x="208.0" y="174.33333333333334" font-size="13" fill="#6A5B50" text-anchor="middle" >Ethiopia</text><text x="160" y="226" font-size="10" fill="#9C8A76" text-anchor="middle" >(in the order the book lists them)</text>
