<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="0" width="320" height="240" fill="#FFF4CC"/><rect x="0" y="206" width="320" height="34" fill="#EBD7B0"/><g data-s="c1"><g transform="translate(110 160) scale(0.9)"><path d="M-40 0q0-30 20-30q10-20 20 0q10-16 20 0q10 0 14 10l14-26q10-4 12 4l-6 6-14 34" fill="#D9A566" stroke="#B8704F" stroke-width="2.5"/><path d="M-34 4v40M-20 4v40M14 4v40M28 4v40" stroke="#B8704F" stroke-width="5" stroke-linecap="round"/><rect x="-22" y="-44" width="36" height="18" rx="3" fill="#C9B49C" stroke="#6A5B50" stroke-width="2"/><circle cx="54" cy="-22" r="2.2" fill="#6A5B50"/></g><text x="160" y="36" font-size="13" fill="#6A5B50" text-anchor="middle" >Camels carry heavy loads far,</text><text x="160" y="54" font-size="13" fill="#6A5B50" text-anchor="middle" >even when thirsty and hungry.</text></g><g data-s="c2"><g transform="translate(60 160) scale(0.6)"><path d="M-40 0q0-30 20-30q10-20 20 0q10-16 20 0q10 0 14 10l14-26q10-4 12 4l-6 6-14 34" fill="#D9A566" stroke="#B8704F" stroke-width="2.5"/><path d="M-34 4v40M-20 4v40M14 4v40M28 4v40" stroke="#B8704F" stroke-width="5" stroke-linecap="round"/><rect x="-22" y="-44" width="36" height="18" rx="3" fill="#C9B49C" stroke="#6A5B50" stroke-width="2"/><circle cx="54" cy="-22" r="2.2" fill="#6A5B50"/></g><g transform="translate(150 160) scale(0.6)"><path d="M-40 0q0-30 20-30q10-20 20 0q10-16 20 0q10 0 14 10l14-26q10-4 12 4l-6 6-14 34" fill="#D9A566" stroke="#B8704F" stroke-width="2.5"/><path d="M-34 4v40M-20 4v40M14 4v40M28 4v40" stroke="#B8704F" stroke-width="5" stroke-linecap="round"/><rect x="-22" y="-44" width="36" height="18" rx="3" fill="#C9B49C" stroke="#6A5B50" stroke-width="2"/><circle cx="54" cy="-22" r="2.2" fill="#6A5B50"/></g><g transform="translate(240 160) scale(0.6)"><path d="M-40 0q0-30 20-30q10-20 20 0q10-16 20 0q10 0 14 10l14-26q10-4 12 4l-6 6-14 34" fill="#D9A566" stroke="#B8704F" stroke-width="2.5"/><path d="M-34 4v40M-20 4v40M14 4v40M28 4v40" stroke="#B8704F" stroke-width="5" stroke-linecap="round"/><rect x="-22" y="-44" width="36" height="18" rx="3" fill="#C9B49C" stroke="#6A5B50" stroke-width="2"/><circle cx="54" cy="-22" r="2.2" fill="#6A5B50"/></g><text x="160" y="36" font-size="13" fill="#6A5B50" text-anchor="middle" >1982: Grandfather takes three camels</text><text x="160" y="54" font-size="13" fill="#6A5B50" text-anchor="middle" >to carry supplies for the fighters.</text></g><g data-s="c3"><g transform="translate(150 160) scale(0.9)"><path d="M-40 0q0-30 20-30q10-20 20 0q10-16 20 0q10 0 14 10l14-26q10-4 12 4l-6 6-14 34" fill="#D9A566" stroke="#B8704F" stroke-width="2.5"/><path d="M-34 4v40M-20 4v40M14 4v40M28 4v40" stroke="#B8704F" stroke-width="5" stroke-linecap="round"/><rect x="-22" y="-44" width="36" height="18" rx="3" fill="#C9B49C" stroke="#6A5B50" stroke-width="2"/><path d="M51 -24l6 4" stroke="#6A5B50" stroke-width="2"/></g><text x="160" y="36" font-size="13" fill="#A8412A" text-anchor="middle" >A land mine: two camels are lost.</text><text x="160" y="54" font-size="13" fill="#A8412A" text-anchor="middle" >Gerun is hurt and loses one eye,</text><text x="160" y="72" font-size="13" fill="#A8412A" text-anchor="middle" >but he finishes the journey.</text></g><g data-s="c4"><g transform="translate(110 160) scale(0.9)"><path d="M-40 0q0-30 20-30q10-20 20 0q10-16 20 0q10 0 14 10l14-26q10-4 12 4l-6 6-14 34" fill="#D9A566" stroke="#B8704F" stroke-width="2.5"/><path d="M-34 4v40M-20 4v40M14 4v40M28 4v40" stroke="#B8704F" stroke-width="5" stroke-linecap="round"/><path d="M51 -24l6 4" stroke="#6A5B50" stroke-width="2"/></g><g transform="translate(250 206) scale(0.8)"><path d="M-9 0v-34M9 0v-34" stroke="#8A5A3C" stroke-width="7" stroke-linecap="round"/><rect x="-15" y="-72" width="30" height="40" rx="8" fill="#4A4A55" stroke="#6A5B50" stroke-width="2"/><rect x="-14" y="-36" width="28" height="8" fill="#6A5B50" opacity=".5"/><path d="M-14 -66q-14 14-10 30M14 -66q14 14 10 30" stroke="#8A5A3C" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="0" cy="-88" r="16" fill="#8A5A3C" stroke="#6A5B50" stroke-width="2"/><path d="M-16 -92q2-18 16-18t16 18q-6-8-16-9q-10 1-16 9z" fill="#E8E2DA"/><circle cx="-6" cy="-89" r="2" fill="#3B2A20"/><circle cx="6" cy="-89" r="2" fill="#3B2A20"/><path d="M-6 -81q6 5 12 0" stroke="#3B2A20" stroke-width="2" fill="none"/><path d="M22 -40v40" stroke="#8A6A50" stroke-width="3"/></g><text x="160" y="36" font-size="13" fill="#2F6B3A" text-anchor="middle" >Gerun serves until independence</text><text x="160" y="54" font-size="13" fill="#2F6B3A" text-anchor="middle" >in May 1991. Grandfather cares for him.</text></g>
</svg>
