<rect x="0" y="210" width="320" height="30" fill="#DDEFD8"/><g transform="translate(260 210) scale(1.2)"><rect x="-6" y="-40" width="12" height="40" fill="#B8704F"/><circle cx="0" cy="-58" r="28" fill="#5CA75C" stroke="#2F6B3A" stroke-width="2.5"/></g><path d="M258 124q8-10 16 0q-8 4-16 0z" fill="#222"/><circle cx="270" cy="120" r="5" fill="#222"/><g transform="translate(80 212) scale(0.9)"><path d="M-9 0v-34M9 0v-34" stroke="#C98B63" stroke-width="7" stroke-linecap="round"/><rect x="-15" y="-72" width="30" height="40" rx="8" fill="#C9B49C" stroke="#6A5B50" stroke-width="2"/><rect x="-14" y="-36" width="28" height="8" fill="#6A5B50" opacity=".5"/><path d="M-14 -66q-14 14-10 30M14 -66q14 14 10 30" stroke="#C98B63" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="0" cy="-88" r="16" fill="#C98B63" stroke="#6A5B50" stroke-width="2"/><path d="M-16 -92q2-18 16-18t16 18q-6-8-16-9q-10 1-16 9z" fill="#E8E2DA"/><circle cx="-6" cy="-89" r="2" fill="#3B2A20"/><circle cx="6" cy="-89" r="2" fill="#3B2A20"/><path d="M-6 -81q6 5 12 0" stroke="#3B2A20" stroke-width="2" fill="none"/><path d="M22 -40v40" stroke="#8A6A50" stroke-width="3"/></g><g transform="translate(150 212) scale(0.7)"><path d="M-9 0v-34M9 0v-34" stroke="#C98B63" stroke-width="7" stroke-linecap="round"/><rect x="-15" y="-72" width="30" height="40" rx="8" fill="#9CC0E6" stroke="#6A5B50" stroke-width="2"/><rect x="-14" y="-36" width="28" height="8" fill="#6A5B50" opacity=".5"/><path d="M-14 -66q-14 14-10 30M14 -66q14 14 10 30" stroke="#C98B63" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="0" cy="-88" r="16" fill="#C98B63" stroke="#6A5B50" stroke-width="2"/><path d="M-16 -92q2-18 16-18t16 18q-6-8-16-9q-10 1-16 9z" fill="#3B2A20"/><circle cx="-6" cy="-89" r="2" fill="#3B2A20"/><circle cx="6" cy="-89" r="2" fill="#3B2A20"/><path d="M-6 -81q6 5 12 0" stroke="#3B2A20" stroke-width="2" fill="none"/></g><g data-s="c1"><rect x="10" y="20" width="96" height="24" rx="9" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M18 43l0 12l6 -12" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M19 43h11" stroke="#fff" stroke-width="3"/><text x="58.040000000000006" y="36" font-size="11" fill="#6A5B50" text-anchor="middle" >What is that?</text><rect x="150" y="60" width="90" height="24" rx="9" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M158 83l0 12l6 -12" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M159 83h11" stroke="#fff" stroke-width="3"/><text x="194.96" y="76" font-size="11" fill="#6A5B50" text-anchor="middle" >It's a crow.</text></g><g data-s="c2"><rect x="10" y="20" width="170" height="24" rx="9" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M18 43l0 12l6 -12" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M19 43h11" stroke="#fff" stroke-width="3"/><text x="95.00000000000001" y="36" font-size="11" fill="#6A5B50" text-anchor="middle" >What's that? (third time)</text><rect x="120" y="60" width="170" height="24" rx="9" fill="#fff" stroke="#A8412A" stroke-width="2"/><path d="M128 83l0 12l6 -12" fill="#fff" stroke="#A8412A" stroke-width="2"/><path d="M129 83h11" stroke="#fff" stroke-width="3"/><text x="205.0" y="76" font-size="11" fill="#A8412A" text-anchor="middle" >It is a CROW, CROW, CROW!</text></g><g data-s="c3"><rect x="10" y="16" width="225" height="52" rx="9" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M18 67l0 12l6 -12" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M19 67h11" stroke="#fff" stroke-width="3"/><text x="122.72000000000001" y="32" font-size="11" fill="#6A5B50" text-anchor="middle" >When you were four and five,</text><text x="122.72000000000001" y="46" font-size="11" fill="#6A5B50" text-anchor="middle" >you asked me more than 100 times.</text><text x="122.72000000000001" y="60" font-size="11" fill="#6A5B50" text-anchor="middle" >I answered every time with a kiss.</text></g><g data-s="c4"><rect x="110" y="30" width="170" height="38" rx="9" fill="#fff" stroke="#2F6B3A" stroke-width="2"/><path d="M118 67l0 12l6 -12" fill="#fff" stroke="#2F6B3A" stroke-width="2"/><path d="M119 67h11" stroke="#fff" stroke-width="3"/><text x="195.0" y="46" font-size="11" fill="#2F6B3A" text-anchor="middle" >I am sorry, Grandfather.</text><text x="195.0" y="60" font-size="11" fill="#2F6B3A" text-anchor="middle" >I will never do it again.</text></g>
</svg>
