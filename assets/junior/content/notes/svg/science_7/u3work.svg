</text><text x="160" y="40" font-size="13" fill="#6A5B50" text-anchor="middle" >same direction:</text><text x="160" y="58" font-size="14" fill="#2F6B3A" text-anchor="middle" >work IS done</text></g><g data-s="carry"><g transform="translate(120 200) scale(1)"><circle cx="0" cy="-58" r="10" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><path d="M0 -48v30M0 -18l-10 18M0 -18l10 18" stroke="#D9765A" stroke-width="5" stroke-linecap="round"/></g><rect x="130" y="130" width="28" height="24" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2"/><g ><path d="M144.0 124.0L144.0 93.6" stroke="#A8412A" stroke-width="4" stroke-linecap="round"/><path d="M144.0 84.0L138.4 93.6L149.6 93.6Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g><text x="144" y="76" font-size="12" fill="#A8412A" text-anchor="middle" >force up</text><g ><path d="M180.0 150.0L250.4 150.0" stroke="#2F6B3A" stroke-width="4" stroke-linecap="round"/><path d="M260.0 150.0L250.4 144.4L250.4 155.6Z" fill="#2F6B3A" stroke="#2F6B3A" stroke-width="2" stroke-linejoin="round"/></g><text x="220" y="140" font-size="12" fill="#2F6B3A" text-anchor="middle" >motion forward</text><text x="160" y="40" font-size="13" fill="#6A5B50" text-anchor="middle" >force and motion NOT</text><text x="160" y="58" font-size="13" fill="#6A5B50" text-anchor="middle" >in the same direction</text></g>
</svg>
