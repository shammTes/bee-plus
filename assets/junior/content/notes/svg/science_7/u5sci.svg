<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="196" width="320" height="44" fill="#D9C2A5"/><g transform="translate(90 150) scale(1.1)"><ellipse cx="0" cy="0" rx="34" ry="18" fill="#FFFBF2" stroke="#6A5B50" stroke-width="2"/><ellipse cx="-8" cy="-4" rx="8" ry="6" fill="#6A5B50"/><ellipse cx="40" cy="-12" rx="12" ry="9" fill="#FFFBF2" stroke="#6A5B50" stroke-width="2"/><path d="M-24 14v22M-10 16v20M14 16v20M26 14v22" stroke="#6A5B50" stroke-width="4"/><path d="M36 -20l-4-8M46 -20l4-8" stroke="#6A5B50" stroke-width="2"/></g><g data-s="z1"><text x="160" y="34" font-size="14" fill="#A8412A" text-anchor="middle" >Problem: the ox is very sick</text><text x="160" y="54" font-size="12" fill="#6A5B50" text-anchor="middle" >traditional medicine did not help</text></g><g data-s="z2"><circle cx="240" cy="110" r="12" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><path d="M240 122v40M240 162l-10 30M240 162l10 30M240 134l-14 16M240 134l14 16" stroke="#D9765A" stroke-width="5" stroke-linecap="round" fill="none"/><text x="160" y="30" font-size="13" fill="#5F90C4" text-anchor="middle" >Zahra asks and observes:</text><text x="160" y="48" font-size="12" fill="#6A5B50" text-anchor="middle" >mucus, eats little, less active</text></g><g data-s="z3"><rect x="200" y="70" width="110" height="40" rx="14" fill="#fff" stroke="#6A5B50" stroke-width="2"/><text x="255" y="88" font-size="11" fill="#6A5B50" text-anchor="middle" >Maybe it is</text><text x="255" y="102" font-size="11" fill="#A8412A" text-anchor="middle" >Rinderpest?</text><text x="160" y="40" font-size="13" fill="#6A4C9C" text-anchor="middle" >Zahra makes a guess</text></g><g data-s="z4"><rect x="226" y="80" width="14" height="60" rx="6" fill="#fff" stroke="#6A5B50" stroke-width="2"/><rect x="228" y="110" width="10" height="28" rx="4" fill="#E4574A"/><text x="160" y="34" font-size="13" fill="#5F90C4" text-anchor="middle" >She tests a blood sample</text><text x="160" y="52" font-size="12" fill="#6A5B50" text-anchor="middle" >in the laboratory</text></g><g data-s="z5"><rect x="220" y="100" width="40" height="30" rx="4" fill="#fff" stroke="#6A5B50" stroke-width="2"/><path d="M234 110h12M240 104v12" stroke="#E4574A" stroke-width="3"/><text x="160" y="30" font-size="13" fill="#A8412A" text-anchor="middle" >Result: Rinderpest (a virus)</text><text x="160" y="48" font-size="12" fill="#2F6B3A" text-anchor="middle" >she gives the right medicine</text></g>
</svg>
