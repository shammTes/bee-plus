<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="g1"><rect x="132" y="50" width="16" height="140" rx="8" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><rect x="132" y="60" width="16" height="6" fill="#5F90C4"/><rect x="132" y="80" width="16" height="6" fill="#5F90C4"/><rect x="132" y="100" width="16" height="6" fill="#5F90C4"/><rect x="132" y="120" width="16" height="6" fill="#5F90C4"/><rect x="132" y="140" width="16" height="6" fill="#5F90C4"/><rect x="132" y="160" width="16" height="6" fill="#5F90C4"/><rect x="132" y="180" width="16" height="6" fill="#5F90C4"/><rect x="132" y="120" width="16" height="10" fill="#E4574A"/><rect x="172" y="50" width="16" height="140" rx="8" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><rect x="172" y="60" width="16" height="6" fill="#5F90C4"/><rect x="172" y="80" width="16" height="6" fill="#5F90C4"/><rect x="172" y="100" width="16" height="6" fill="#5F90C4"/><rect x="172" y="120" width="16" height="6" fill="#5F90C4"/><rect x="172" y="140" width="16" height="6" fill="#5F90C4"/><rect x="172" y="160" width="16" height="6" fill="#5F90C4"/><rect x="172" y="180" width="16" height="6" fill="#5F90C4"/><rect x="172" y="120" width="16" height="10" fill="#E4574A"/><text x="160" y="30" font-size="12" fill="#5F90C4" text-anchor="middle" >genes sit on chromosomes like beads</text><text x="160" y="220" font-size="12" fill="#A8412A" text-anchor="middle" >one pair of genes (red) → one trait</text></g><g data-s="g2"><rect x="82" y="50" width="16" height="140" rx="8" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><rect x="82" y="60" width="16" height="6" fill="#5F90C4"/><rect x="82" y="80" width="16" height="6" fill="#5F90C4"/><rect x="82" y="100" width="16" height="6" fill="#5F90C4"/><rect x="82" y="120" width="16" height="6" fill="#5F90C4"/><rect x="82" y="140" width="16" height="6" fill="#5F90C4"/><rect x="82" y="160" width="16" height="6" fill="#5F90C4"/><rect x="82" y="180" width="16" height="6" fill="#5F90C4"/><rect x="82" y="120" width="16" height="10" fill="#E4574A"/><rect x="222" y="50" width="16" height="140" rx="8" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><rect x="222" y="60" width="16" height="6" fill="#5F90C4"/><rect x="222" y="80" width="16" height="6" fill="#5F90C4"/><rect x="222" y="100" width="16" height="6" fill="#5F90C4"/><rect x="222" y="120" width="16" height="6" fill="#5F90C4"/><rect x="222" y="140" width="16" height="6" fill="#5F90C4"/><rect x="222" y="160" width="16" height="6" fill="#5F90C4"/><rect x="222" y="180" width="16" height="6" fill="#5F90C4"/><rect x="222" y="120" width="16" height="10" fill="#E4574A"/><g ><path d="M120.0 120.0L77.2 120.0" stroke="#6A5B50" stroke-width="2" stroke-linecap="round"/><path d="M70.0 120.0L77.2 124.2L77.2 115.8Z" fill="#6A5B50" stroke="#6A5B50" stroke-width="2" stroke-linejoin="round"/></g><g ><path d="M200.0 120.0L242.8 120.0" stroke="#6A5B50" stroke-width="2" stroke-linecap="round"/><path d="M250.0 120.0L242.8 115.8L242.8 124.2Z" fill="#6A5B50" stroke="#6A5B50" stroke-width="2" stroke-linejoin="round"/></g><text x="160" y="30" font-size="12" fill="#6A5B50" text-anchor="middle" >cell division: the pair separates</text><text x="160" y="220" font-size="12" fill="#A8412A" text-anchor="middle" >so a sex cell has single genes</text></g><g data-s="g3"><rect x="132" y="50" width="16" height="140" rx="8" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><rect x="132" y="60" width="16" height="6" fill="#5F90C4"/><rect x="132" y="80" width="16" height="6" fill="#5F90C4"/><rect x="132" y="100" width="16" height="6" fill="#5F90C4"/><rect x="132" y="120" width="16" height="6" fill="#5F90C4"/><rect x="132" y="140" width="16" height="6" fill="#5F90C4"/><rect x="132" y="160" width="16" height="6" fill="#5F90C4"/><rect x="132" y="180" width="16" height="6" fill="#5F90C4"/><rect x="132" y="120" width="16" height="10" fill="#E4574A"/><text x="118" y="130" font-size="13" fill="#A8412A" text-anchor="middle" >T</text><rect x="172" y="50" width="16" height="140" rx="8" fill="#D9E8F7" stroke="#5F90C4" stroke-width="2"/><rect x="172" y="60" width="16" height="6" fill="#5F90C4"/><rect x="172" y="80" width="16" height="6" fill="#5F90C4"/><rect x="172" y="100" width="16" height="6" fill="#5F90C4"/><rect x="172" y="120" width="16" height="6" fill="#5F90C4"/><rect x="172" y="140" width="16" height="6" fill="#5F90C4"/><rect x="172" y="160" width="16" height="6" fill="#5F90C4"/><rect x="172" y="180" width="16" height="6" fill="#5F90C4"/><rect x="172" y="120" width="16" height="10" fill="#E4574A"/><text x="202" y="130" font-size="13" fill="#A8412A" text-anchor="middle" >t</text><text x="160" y="30" font-size="12" fill="#6A5B50" text-anchor="middle" >fertilization: father’s gene + mother’s gene</text><text x="160" y="220" font-size="12" fill="#A8412A" text-anchor="middle" >a new pair, e.g. Tt</text></g>
</svg>
