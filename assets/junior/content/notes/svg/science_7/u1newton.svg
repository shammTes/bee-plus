<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="170" width="320" height="70" fill="#C99A6B"/><path d="M0 170h320" stroke="#B8704F" stroke-width="4"/><g data-s="rest"><rect x="130" y="130" width="60" height="40" rx="4" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2"/><text x="160" y="110" font-size="13" fill="#2F6B3A" text-anchor="middle" >at rest: net force = 0</text><text x="160" y="60" font-size="13" fill="#6A5B50" text-anchor="middle" >it stays at rest</text></g><g data-s="push"><rect x="130" y="130" width="60" height="40" rx="4" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2"/><g ><path d="M60.0 150.0L115.2 150.0" stroke="#A8412A" stroke-width="5" stroke-linecap="round"/><path d="M126.0 150.0L115.2 143.7L115.2 156.3Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g><text x="80" y="120" font-size="13" fill="#A8412A" text-anchor="middle" >push</text><text x="160" y="60" font-size="13" fill="#6A5B50" text-anchor="middle" >a net force starts the motion</text></g><g data-s="slow"><rect x="230" y="130" width="60" height="40" rx="4" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2"/><g ><path d="M226.0 180.0L179.6 180.0" stroke="#5F90C4" stroke-width="4" stroke-linecap="round"/><path d="M170.0 180.0L179.6 185.6L179.6 174.4Z" fill="#5F90C4" stroke="#5F90C4" stroke-width="2" stroke-linejoin="round"/></g><text x="190" y="206" font-size="13" fill="#fff" text-anchor="middle" >friction</text><text x="160" y="60" font-size="13" fill="#6A5B50" text-anchor="middle" >friction slows it and stops it</text></g>
</svg>
