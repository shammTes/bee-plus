<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="tri"><path d="M60 190H260V60z" fill="#fff" stroke="#6A5B50" stroke-width="3"/><path d="M60 190L260 60" stroke="#E4574A" stroke-width="4"/><text x="200" y="214" font-size="14" fill="#6A5B50" text-anchor="middle" >A</text><text x="120" y="110" font-size="12" fill="#6A5B50" text-anchor="middle" >a paper triangle:</text><text x="120" y="126" font-size="12" fill="#6A5B50" text-anchor="middle" >the long side is a ramp</text></g><g data-s="roll"><rect x="150" y="30" width="20" height="190" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/><path d="M150 210L170 196M150 186L170 172M150 162L170 148M150 138L170 124M150 114L170 100M150 90L170 76M150 66L170 52" stroke="#E4574A" stroke-width="3"/><text x="250" y="120" font-size="12" fill="#6A5B50" text-anchor="middle" >rolled round a pencil:</text><text x="250" y="136" font-size="12" fill="#6A5B50" text-anchor="middle" >a thread like a screw</text></g><g data-s="jack"><path d="M60 200h200" stroke="#6A5B50" stroke-width="4"/><path d="M120 200l40-60 40 60M120 80l40 60 40-60" fill="none" stroke="#6F7C88" stroke-width="6"/><rect x="100" y="70" width="120" height="12" fill="#9C8A76"/><path d="M160 140H290" stroke="#E4574A" stroke-width="4"/><circle cx="290" cy="140" r="6" fill="#E4574A"/><text x="160" y="40" font-size="12" fill="#6A5B50" text-anchor="middle" >car jack: small force turns the screw</text><text x="160" y="56" font-size="12" fill="#6A5B50" text-anchor="middle" >and lifts the car</text></g>
</svg>
