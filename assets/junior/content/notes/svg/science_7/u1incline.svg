<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="200" width="320" height="40" fill="#D9C2A5"/><rect x="220" y="100" width="90" height="100" fill="#B8704F" stroke="#6A5B50" stroke-width="2"/><text x="265" y="156" font-size="13" fill="#fff" text-anchor="middle" >box</text><g data-s="lift"><rect x="170" y="60" width="36" height="30" rx="5" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><g ><path d="M188.0 180.0L188.0 105.6" stroke="#A8412A" stroke-width="4" stroke-linecap="round"/><path d="M188.0 96.0L182.4 105.6L193.6 105.6Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g><text x="130" y="130" font-size="12" fill="#A8412A" text-anchor="middle" >lift straight up:</text><text x="130" y="146" font-size="12" fill="#A8412A" text-anchor="middle" >more effort,</text><text x="130" y="162" font-size="12" fill="#A8412A" text-anchor="middle" >short distance</text></g><g data-s="ramp"><path d="M40 200L220 100" stroke="#DDA42A" stroke-width="7"/><rect x="110" y="132" width="36" height="30" rx="5" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><g transform="rotate(-29 128 147)"></g><g ><path d="M150.0 150.0L191.6 126.7" stroke="#A8412A" stroke-width="4" stroke-linecap="round"/><path d="M200.0 122.0L188.9 121.8L194.4 131.6Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g><text x="120" y="206" font-size="12" fill="#6A5B50" text-anchor="middle" ></text><text x="90" y="110" font-size="12" fill="#2F6B3A" text-anchor="middle" >along the plank:</text><text x="90" y="126" font-size="12" fill="#2F6B3A" text-anchor="middle" >less effort,</text><text x="90" y="142" font-size="12" fill="#2F6B3A" text-anchor="middle" >longer distance</text></g>
</svg>
