<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="z"><circle cx="160" cy="120" r="30" fill="#FFC9BA" stroke="#D9765A" stroke-width="2.5"/><circle cx="160" cy="120" r="8" fill="#6A4C9C"/><text x="160" y="200" font-size="13" fill="#A8412A" text-anchor="middle" >a zygote: one cell</text></g><g data-s="two"><circle cx="138" cy="120" r="22" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><circle cx="182" cy="120" r="22" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><text x="160" y="200" font-size="13" fill="#A8412A" text-anchor="middle" >it divides: 2 cells, then 4…</text></g><g data-s="emb"><circle cx="160" cy="120" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="142" cy="110" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="178" cy="110" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="142" cy="132" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="178" cy="132" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="160" cy="98" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="160" cy="142" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="130" cy="120" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><circle cx="190" cy="120" r="11" fill="#FFC9BA" stroke="#D9765A" stroke-width="1.5"/><text x="160" y="200" font-size="13" fill="#A8412A" text-anchor="middle" >a ball of cells: an embryo</text></g><g data-s="fet"><circle cx="160" cy="120" r="70" fill="#EAE0F7" opacity=".5"/><circle cx="180" cy="96" r="22" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><path d="M168 116q-40 10-30 50q20 10 40-10q10-20-10-40z" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><path d="M150 150q-40 30-80 60" stroke="#E4574A" stroke-width="3" fill="none"/><text x="80" y="226" font-size="11" fill="#E4574A" text-anchor="middle" >placenta: food and oxygen</text><text x="250" y="40" font-size="13" fill="#A8412A" text-anchor="middle" >3rd month: a fetus</text><text x="250" y="58" font-size="10" fill="#6A5B50" text-anchor="middle" >(organs like the heart)</text></g><g data-s="baby"><circle cx="160" cy="80" r="30" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><rect x="130" y="110" width="60" height="70" rx="24" fill="#FFF4CC" stroke="#DDA42A" stroke-width="2"/><text x="160" y="214" font-size="13" fill="#A8412A" text-anchor="middle" >a baby ready to be born</text></g>
