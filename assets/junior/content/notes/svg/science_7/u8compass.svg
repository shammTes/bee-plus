<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<circle cx="120" cy="120" r="60" fill="#FFFBF2" stroke="#6A5B50" stroke-width="4"/><text x="120" y="72" font-size="12" fill="#6A5B50" text-anchor="middle" >N</text><text x="120" y="178" font-size="12" fill="#6A5B50" text-anchor="middle" >S</text><text x="70" y="124" font-size="12" fill="#6A5B50" text-anchor="middle" >W</text><text x="170" y="124" font-size="12" fill="#6A5B50" text-anchor="middle" >E</text><g data-s="free"><g transform="rotate(0 120 120)"><path d="M120 80l8 40h-16z" fill="#E4574A"/><path d="M120 160l8-40h-16z" fill="#6FA8DC"/><circle cx="120" cy="120" r="4" fill="#6A5B50"/></g><text x="250" y="110" font-size="12" fill="#6A5B50" text-anchor="middle" >the needle</text><text x="250" y="126" font-size="12" fill="#6A5B50" text-anchor="middle" >points north–south</text></g><g data-s="near"><g transform="rotate(60 120 120)"><path d="M120 80l8 40h-16z" fill="#E4574A"/><path d="M120 160l8-40h-16z" fill="#6FA8DC"/><circle cx="120" cy="120" r="4" fill="#6A5B50"/></g><g transform="rotate(180 260 150)"><rect x="215.0" y="137.0" width="45.0" height="26" fill="#E4574A" stroke="#6A5B50" stroke-width="2"/><rect x="260" y="137.0" width="45.0" height="26" fill="#6FA8DC" stroke="#6A5B50" stroke-width="2"/><text x="237.5" y="155" font-size="13" fill="#fff" text-anchor="middle" >N</text><text x="282.5" y="155" font-size="13" fill="#fff" text-anchor="middle" >S</text></g><text x="250" y="60" font-size="12" fill="#A8412A" text-anchor="middle" >a magnet nearby</text><text x="250" y="76" font-size="12" fill="#A8412A" text-anchor="middle" >turns the needle</text></g><g data-s="earth"><g transform="rotate(0 120 120)"><path d="M120 80l8 40h-16z" fill="#E4574A"/><path d="M120 160l8-40h-16z" fill="#6FA8DC"/><circle cx="120" cy="120" r="4" fill="#6A5B50"/></g><circle cx="260" cy="120" r="40" fill="#6FA8DC"/><rect x="252" y="90" width="16" height="60" fill="#9C8A76" opacity=".8"/><text x="260" y="184" font-size="11" fill="#6A5B50" text-anchor="middle" >the Earth acts like</text><text x="260" y="198" font-size="11" fill="#6A5B50" text-anchor="middle" >a big bar magnet</text></g>
</svg>
