<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="gon"><rect x="136" y="70" width="48" height="20" rx="10" fill="#DDEFD8" stroke="#2F6B3A" stroke-width="2.5"/><text x="160" y="30" font-size="14" fill="#2F6B3A" text-anchor="middle" >gonorrhea: a bacterium</text><text x="160" y="140" font-size="12" fill="#6A5B50" text-anchor="middle" >burning pain when urinating</text><text x="160" y="160" font-size="12" fill="#6A5B50" text-anchor="middle" >yellowish fluid after 3 – 7 days</text><text x="160" y="196" font-size="13" fill="#2F6B3A" text-anchor="middle" >CAN be cured if treated properly</text></g><g data-s="syp"><path d="M130 80q7-14 15 0t15 0t15 0t15 0" stroke="#2F6B3A" stroke-width="4" fill="none"/><text x="160" y="30" font-size="14" fill="#2F6B3A" text-anchor="middle" >syphilis: another bacterium</text><text x="160" y="140" font-size="12" fill="#6A5B50" text-anchor="middle" >small painless spots, skin rashes</text><text x="160" y="160" font-size="12" fill="#6A5B50" text-anchor="middle" >rashes may go away without treatment</text><text x="160" y="196" font-size="13" fill="#2F6B3A" text-anchor="middle" >CAN be cured if treated properly</text></g><g data-s="aids"><circle cx="160" cy="84" r="18" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2.5"/><path d="M160 84l0 -26" stroke="#6A4C9C" stroke-width="2"/><circle cx="160" cy="58" r="3" fill="#6A4C9C"/><path d="M160 84l0 26" stroke="#6A4C9C" stroke-width="2"/><circle cx="160" cy="110" r="3" fill="#6A4C9C"/><path d="M160 84l-26 0" stroke="#6A4C9C" stroke-width="2"/><circle cx="134" cy="84" r="3" fill="#6A4C9C"/><path d="M160 84l26 0" stroke="#6A4C9C" stroke-width="2"/><circle cx="186" cy="84" r="3" fill="#6A4C9C"/><path d="M160 84l18 18" stroke="#6A4C9C" stroke-width="2"/><circle cx="178" cy="102" r="3" fill="#6A4C9C"/><path d="M160 84l-18 -18" stroke="#6A4C9C" stroke-width="2"/><circle cx="142" cy="66" r="3" fill="#6A4C9C"/><path d="M160 84l18 -18" stroke="#6A4C9C" stroke-width="2"/><circle cx="178" cy="66" r="3" fill="#6A4C9C"/><path d="M160 84l-18 18" stroke="#6A4C9C" stroke-width="2"/><circle cx="142" cy="102" r="3" fill="#6A4C9C"/><text x="160" y="30" font-size="14" fill="#6A4C9C" text-anchor="middle" >AIDS: caused by a virus, HIV</text><text x="160" y="140" font-size="12" fill="#6A5B50" text-anchor="middle" >a killing disease</text><text x="160" y="160" font-size="12" fill="#6A5B50" text-anchor="middle" >no vaccine and no cure</text><text x="160" y="196" font-size="13" fill="#A8412A" text-anchor="middle" >prevent it: abstinence</text></g>
</svg>
