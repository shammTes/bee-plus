<path d="M120 70q40-14 80 0q-4 70-26 90v30h-28v-30q-22-20-26-90z" fill="#F3B7B0" stroke="#C9736A" stroke-width="2.5"/><path d="M122 74q-30-20-56-6" stroke="#C9736A" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M198 74q30-20 56-6" stroke="#C9736A" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="62" cy="86" rx="16" ry="11" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/><ellipse cx="258" cy="86" rx="16" ry="11" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/><rect x="150" y="160" width="20" height="10" fill="#C9736A"/><path d="M146 190h28v36h-28z" fill="#F3B7B0" stroke="#C9736A" stroke-width="2"/><g data-s="m1"><circle cx="62" cy="86" r="5" fill="#fff" stroke="#A8412A" stroke-width="2"/><text x="160" y="24" font-size="12" fill="#A8412A" text-anchor="middle" >an ovum matures in one ovary</text></g><g data-s="m2"><circle cx="96" cy="64" r="5" fill="#fff" stroke="#A8412A" stroke-width="2"/><g ><path d="M80.0 72.0L110.1 67.0" stroke="#A8412A" stroke-width="2" stroke-linecap="round"/><path d="M116.0 66.0L109.5 63.5L110.7 70.4Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g><text x="160" y="24" font-size="12" fill="#A8412A" text-anchor="middle" >it moves along the fallopian tube</text></g><g data-s="m3"><circle cx="160" cy="110" r="5" fill="#ddd" stroke="#9C8A76" stroke-width="2"/><text x="160" y="24" font-size="12" fill="#9C8A76" text-anchor="middle" >not fertilized: the ovum dies</text></g><g data-s="m4"><path d="M130 80q30 10 60 0" stroke="#C23E33" stroke-width="5" fill="none"/><circle cx="160" cy="180" r="3" fill="#C23E33"/><circle cx="160" cy="198" r="3" fill="#C23E33"/><circle cx="160" cy="214" r="3" fill="#C23E33"/><text x="160" y="24" font-size="12" fill="#C23E33" text-anchor="middle" >the lining breaks: menstruation (4 – 5 days)</text></g>
