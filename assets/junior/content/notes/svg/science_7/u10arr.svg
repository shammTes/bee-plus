<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="0" y="210" width="320" height="30" fill="#B8865F"/><g data-s="a"><path d="M160 210V90" stroke="#2F6B3A" stroke-width="4"/><circle cx="160" cy="80" r="12" fill="#6A4C9C" stroke="#6A5B50" stroke-width="1.5"/><circle cx="130" cy="130" r="12" fill="#6A4C9C" stroke="#6A5B50" stroke-width="1.5"/><circle cx="190" cy="150" r="12" fill="#6A4C9C" stroke="#6A5B50" stroke-width="1.5"/><text x="250" y="100" font-size="11" fill="#6A4C9C" text-anchor="middle" >each flower:</text><text x="250" y="114" font-size="11" fill="#6A4C9C" text-anchor="middle" >male + female</text><text x="160" y="30" font-size="12" fill="#A8412A" text-anchor="middle" >male and female parts in ONE flower</text><text x="160" y="48" font-size="11" fill="#6A5B50" text-anchor="middle" >e.g. beans and peas</text></g><g data-s="b"><path d="M230 210V80" stroke="#2F6B3A" stroke-width="5"/><circle cx="230" cy="80" r="12" fill="#5F90C4" stroke="#6A5B50" stroke-width="1.5"/><circle cx="256" cy="150" r="12" fill="#E4574A" stroke="#6A5B50" stroke-width="1.5"/><text x="274" y="84" font-size="11" fill="#5F90C4" text-anchor="middle" >male</text><text x="260" y="180" font-size="11" fill="#E4574A" text-anchor="middle" >female</text><text x="100" y="30" font-size="12" fill="#A8412A" text-anchor="middle" >separate male and female</text><text x="100" y="48" font-size="12" fill="#A8412A" text-anchor="middle" >flowers on ONE plant</text><text x="100" y="66" font-size="11" fill="#6A5B50" text-anchor="middle" >e.g. maize</text></g><g data-s="c"><path d="M90 210V100M230 210V100" stroke="#2F6B3A" stroke-width="4"/><circle cx="90" cy="96" r="12" fill="#5F90C4" stroke="#6A5B50" stroke-width="1.5"/><circle cx="230" cy="96" r="12" fill="#E4574A" stroke="#6A5B50" stroke-width="1.5"/><text x="126" y="100" font-size="11" fill="#5F90C4" text-anchor="middle" >male</text><text x="274" y="100" font-size="11" fill="#E4574A" text-anchor="middle" >female</text><text x="160" y="30" font-size="12" fill="#A8412A" text-anchor="middle" >male flower on one plant,</text><text x="160" y="48" font-size="11" fill="#6A5B50" text-anchor="middle" >female flower on another: e.g. papaya</text></g>
</svg>
