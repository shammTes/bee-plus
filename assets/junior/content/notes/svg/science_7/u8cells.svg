<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<g data-s="ser"><rect x="80.0" y="96.0" width="60" height="28" rx="4" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><rect x="140.0" y="106" width="5" height="8" fill="#6A5B50"/><text x="132.0" y="114" font-size="11" fill="#fff" text-anchor="middle" >+</text><text x="88.0" y="114" font-size="11" fill="#fff" text-anchor="middle" >–</text><rect x="150.0" y="96.0" width="60" height="28" rx="4" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><rect x="210.0" y="106" width="5" height="8" fill="#6A5B50"/><text x="202.0" y="114" font-size="11" fill="#fff" text-anchor="middle" >+</text><text x="158.0" y="114" font-size="11" fill="#fff" text-anchor="middle" >–</text><text x="160" y="60" font-size="13" fill="#A8412A" text-anchor="middle" >series: + of one to – of the next</text><text x="160" y="170" font-size="12" fill="#6A5B50" text-anchor="middle" >e.g. cells in a torch</text></g><g data-s="par"><rect x="130.0" y="66.0" width="60" height="28" rx="4" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><rect x="190.0" y="76" width="5" height="8" fill="#6A5B50"/><text x="182.0" y="84" font-size="11" fill="#fff" text-anchor="middle" >+</text><text x="138.0" y="84" font-size="11" fill="#fff" text-anchor="middle" >–</text><rect x="130.0" y="136.0" width="60" height="28" rx="4" fill="#9C8A76" stroke="#6A5B50" stroke-width="2"/><rect x="190.0" y="146" width="5" height="8" fill="#6A5B50"/><text x="182.0" y="154" font-size="11" fill="#fff" text-anchor="middle" >+</text><text x="138.0" y="154" font-size="11" fill="#fff" text-anchor="middle" >–</text><path d="M130 80H90V150H130" stroke="#6A5B50" stroke-width="3" fill="none"/><path d="M195 80H230V150H195" stroke="#6A5B50" stroke-width="3" fill="none"/><text x="160" y="30" font-size="13" fill="#A8412A" text-anchor="middle" >parallel: + to +, – to –</text><text x="160" y="210" font-size="12" fill="#6A5B50" text-anchor="middle" >the positives join, the negatives join</text></g>
</svg>
