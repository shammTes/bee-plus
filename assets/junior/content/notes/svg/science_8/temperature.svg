<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" font-family="Nunito,sans-serif" font-weight="900">
  <!-- thermometer -->
  <rect x="274" y="20" width="22" height="170" rx="11" fill="#fff" stroke="#B89C80" stroke-width="3"/>
  <circle cx="285" cy="206" r="20" fill="#EE6A58" stroke="#C23E33" stroke-width="3"/>
  <rect data-s="cold" x="280" y="130" width="10" height="70" rx="5" fill="#EE6A58"/>
  <rect data-s="normal" x="280" y="90" width="10" height="110" rx="5" fill="#EE6A58"/>
  <rect data-s="hot" x="280" y="44" width="10" height="156" rx="5" fill="#EE6A58"/>
  <text data-s="normal" x="262" y="98" text-anchor="end" font-size="18" fill="#2F6B3A">37 °C</text>
  <!-- air + skin layers -->
  <rect data-s="hot" x="0" y="0" width="260" height="70" fill="#FFE3D6"/>
  <rect data-s="cold" x="0" y="0" width="260" height="70" fill="#E3EEFA"/>
  <path d="M0 80Q40 70 80 80T160 80T260 80L260 250L0 250Z" fill="#FFE2CC" stroke="#E3B08E" stroke-width="3"/>
  <path d="M0 110Q40 102 80 110T160 110T260 110L260 250L0 250Z" fill="#FFF0E2"/>
  <!-- hairs: flat (hot) / normal / erect (cold) -->
  <g stroke="#6A5B50" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path data-s="hot" d="M60 78L96 70M150 80L186 72"/>
    <path data-s="normal" d="M60 78L78 52M150 80L168 54"/>
    <path data-s="cold" d="M60 78L62 40M150 80L152 42"/>
  </g>
  <g fill="#C9A88A"><ellipse cx="60" cy="96" rx="6" ry="14"/><ellipse cx="150" cy="98" rx="6" ry="14"/></g>
  <g data-s="cold" fill="#E3B08E"><circle cx="60" cy="76" r="6"/><circle cx="150" cy="78" r="6"/></g>
  <!-- sweat gland + sweat -->
  <path d="M220 200Q210 188 222 180Q234 172 222 164L222 84" fill="none" stroke="#5F90C4" stroke-width="4"/>
  <g data-s="hot" fill="#9EC3EA" stroke="#5F90C4" stroke-width="2"><path d="M222 50C216 60 216 66 222 68C228 66 228 60 222 50Z"/><path d="M200 30C195 38 195 43 200 45C205 43 205 38 200 30Z"/><path d="M240 34C235 42 235 47 240 49C245 47 245 42 240 34Z"/></g>
  <g data-s="hot" fill="none" stroke="#F7A58C" stroke-width="3" stroke-linecap="round"><path d="M110 50q6-8 0-16t0-16M130 50q6-8 0-16t0-16"/></g>
  <!-- blood vessel near the skin: wide (hot) / normal / narrow (cold) -->
  <path data-s="hot" d="M0 150Q130 128 260 150" fill="none" stroke="#C23E33" stroke-width="30" stroke-linecap="round"/>
  <path data-s="hot" d="M0 150Q130 128 260 150" fill="none" stroke="#EE6A58" stroke-width="24" stroke-linecap="round"/>
  <path data-s="normal" d="M0 150Q130 128 260 150" fill="none" stroke="#C23E33" stroke-width="18" stroke-linecap="round"/>
  <path data-s="normal" d="M0 150Q130 128 260 150" fill="none" stroke="#EE6A58" stroke-width="13" stroke-linecap="round"/>
  <path data-s="cold" d="M0 150Q130 128 260 150" fill="none" stroke="#C23E33" stroke-width="8" stroke-linecap="round"/>
  <path data-s="cold" d="M0 150Q130 128 260 150" fill="none" stroke="#EE6A58" stroke-width="4" stroke-linecap="round"/>
  <!-- muscle shivering (cold) -->
  <g data-s="cold"><rect x="20" y="186" width="170" height="40" rx="20" fill="#F4B49C" stroke="#C9785B" stroke-width="3"/>
    <path d="M14 180l-8-6M14 206l-10 0M14 232l-8 6M196 180l8-6M196 206l10 0M196 232l8 6" stroke="#5F90C4" stroke-width="3" stroke-linecap="round"/>
    <text x="105" y="212" text-anchor="middle" font-size="16" fill="#8C3A22">shivering</text></g>
</svg>
