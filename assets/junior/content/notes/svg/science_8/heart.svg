    <path data-s="s4" d="M296 126L214 118"/>
    <path data-s="s5" d="M210 118L210 200"/>
    <path data-s="s6" d="M200 250L186 130L186 66Q192 40 236 44"/>
  </g>
  <g data-s="s7" fill="#FFE08A" stroke="#8A6410" stroke-width="3"><circle cx="110" cy="160" r="14" fill="none"/><circle cx="210" cy="160" r="14" fill="none"/></g>
</svg>
