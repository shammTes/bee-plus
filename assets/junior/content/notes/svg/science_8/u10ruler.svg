<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" font-family="Nunito,sans-serif" font-weight="900">
<rect x="20" y="124" width="130" height="100" fill="#D9B48A" stroke="#B8704F" stroke-width="3"/><rect x="50" y="96" width="80" height="20" rx="3" fill="#EAE0F7" stroke="#6A4C9C" stroke-width="2"/><text x="90" y="112" font-size="12" fill="#6A4C9C" text-anchor="middle" >book</text><text x="85" y="180" font-size="13" fill="#B8704F" text-anchor="middle" >desk</text><g data-s="rest"><g transform="rotate(0 150 120)"><rect x="60" y="116" width="220" height="8" rx="2" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/></g><text x="236" y="170" font-size="12" fill="#6A5B50" text-anchor="middle" >ruler at rest (B)</text></g><g data-s="down"><g transform="rotate(14 150 120)"><rect x="60" y="116" width="220" height="8" rx="2" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/></g><g ><path d="M260.0 110.0L260.0 141.6" stroke="#A8412A" stroke-width="3" stroke-linecap="round"/><path d="M260.0 150.0L264.9 141.6L255.1 141.6Z" fill="#A8412A" stroke="#A8412A" stroke-width="2" stroke-linejoin="round"/></g><text x="246" y="200" font-size="12" fill="#A8412A" text-anchor="middle" >pull down, let go</text></g><g data-s="vib"><g transform="rotate(-10 150 120)"><rect x="60" y="116" width="220" height="8" rx="2" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/></g><g opacity=".45"><g transform="rotate(10 150 120)"><rect x="60" y="116" width="220" height="8" rx="2" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/></g></g><g transform="rotate(0 150 120)"><rect x="60" y="116" width="220" height="8" rx="2" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/></g><path d="M284 80v76" stroke="#A8412A" stroke-width="2" stroke-dasharray="4 3"/><text x="296" y="86" font-size="14" fill="#A8412A" text-anchor="middle" >A</text><text x="296" y="126" font-size="14" fill="#A8412A" text-anchor="middle" >B</text><path d="M300 110q6 8 0 16" transform="rotate(0 290 118)" stroke="#5F90C4" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M310 106q8 12 0 24" transform="rotate(0 290 118)" stroke="#5F90C4" stroke-width="2.5" fill="none" stroke-linecap="round"/><path d="M320 102q10 16 0 32" transform="rotate(0 290 118)" stroke="#5F90C4" stroke-width="2.5" fill="none" stroke-linecap="round"/><text x="200" y="214" font-size="12" fill="#2F6B3A" text-anchor="middle" >it vibrates: we hear sound</text></g><g data-s="stop"><g transform="rotate(0 150 120)"><rect x="60" y="116" width="220" height="8" rx="2" fill="#FFE08A" stroke="#DDA42A" stroke-width="2"/></g><path d="M268 108q6-14 16-10l2 10" fill="#FFC9BA" stroke="#D9765A" stroke-width="2"/><text x="200" y="200" font-size="12" fill="#A8412A" text-anchor="middle" >touch it: it stops, no sound</text></g>
