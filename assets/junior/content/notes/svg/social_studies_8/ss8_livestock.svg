<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Nunito,sans-serif" font-weight="900">
<rect width="320" height="200" fill="#FFFBF2"/><g data-hl="hi"><rect x="20" y="40" width="112" height="60" rx="10" fill="#9CCB8E" stroke="#3E3129" stroke-width="2"/><text x="76" y="68" text-anchor="middle" font-size="20" fill="#fff">40%</text><text x="76" y="88" text-anchor="middle" font-size="12" fill="#fff">highlands</text></g><g data-hl="lo"><rect x="132" y="40" width="168" height="60" rx="10" fill="#DDA42A" stroke="#3E3129" stroke-width="2"/><text x="216" y="68" text-anchor="middle" font-size="20" fill="#fff">60%</text><text x="216" y="88" text-anchor="middle" font-size="12" fill="#fff">lowlands</text></g><text x="160" y="26" text-anchor="middle" font-size="13" fill="#3E3129">Where are Eritrea's livestock?</text><g data-hl="hi"><text x="20" y="130" font-size="11.5" fill="#3E3129">cattle, sheep, goats</text><text x="20" y="148" font-size="11.5" fill="#3E3129">cereal straw as feed</text><text x="20" y="166" font-size="11.5" fill="#3E3129">oxen first in grazing</text></g><g data-hl="lo"><text x="172" y="130" font-size="11.5" fill="#3E3129">camels, cattle, goats,</text><text x="172" y="148" font-size="11.5" fill="#3E3129">sheep; herds move</text><text x="172" y="166" font-size="11.5" fill="#3E3129">for pasture and water</text></g>
</svg>
