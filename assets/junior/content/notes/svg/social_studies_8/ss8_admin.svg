<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 290" font-family="Nunito,sans-serif" font-weight="900">
<defs><marker id="adA" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6A5B50"/></marker></defs><rect width="320" height="290" fill="#FFFBF2"/><g data-hl="gov"><rect x="90" y="8" width="140" height="34" rx="9" fill="#5F90C4" stroke="#3E3129" stroke-width="2"/><text x="160.0" y="30.0" text-anchor="middle" font-size="12.5" fill="#fff">Colonial Governor</text></g><g data-hl="com"><rect x="70" y="64" width="180" height="44" rx="9" fill="#8DB9E3" stroke="#3E3129" stroke-width="2"/><text x="160.0" y="83.5" text-anchor="middle" font-size="12.5" fill="#3E3129">Commissari (Italian</text><text x="160.0" y="98.5" text-anchor="middle" font-size="12.5" fill="#3E3129">administrators)</text></g><g data-hl="hi"><rect x="6" y="134" width="146" height="58" rx="9" fill="#F7C98B" stroke="#3E3129" stroke-width="2"/><text x="79.0" y="153.0" text-anchor="middle" font-size="12.5" fill="#3E3129">Highlands:</text><text x="79.0" y="168.0" text-anchor="middle" font-size="12.5" fill="#3E3129">mislene (appointed</text><text x="79.0" y="183.0" text-anchor="middle" font-size="12.5" fill="#3E3129">traditional leaders)</text></g><g data-hl="lo"><rect x="168" y="134" width="146" height="58" rx="9" fill="#DCE8B8" stroke="#3E3129" stroke-width="2"/><text x="241.0" y="153.0" text-anchor="middle" font-size="12.5" fill="#3E3129">Lowlands: tribal</text><text x="241.0" y="168.0" text-anchor="middle" font-size="12.5" fill="#3E3129">leaders; serfs obey</text><text x="241.0" y="183.0" text-anchor="middle" font-size="12.5" fill="#3E3129">Italians only</text></g><g data-hl="ppl"><rect x="60" y="222" width="200" height="58" rx="9" fill="#F3E6CC" stroke="#3E3129" stroke-width="2"/><text x="160.0" y="241.0" text-anchor="middle" font-size="12.5" fill="#3E3129">The people</text><text x="160.0" y="256.0" text-anchor="middle" font-size="12.5" fill="#3E3129">(taxes, courts,</text><text x="160.0" y="271.0" text-anchor="middle" font-size="12.5" fill="#3