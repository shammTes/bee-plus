name: Build Bee Plus APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Icons + Junior UI pack
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi assets/junior
          python3 - << 'PY'
from pathlib import Path
try:
    from PIL import Image, ImageDraw
except ImportError:
    import subprocess, sys
    subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
    from PIL import Image, ImageDraw
img = Image.new('RGBA', (192, 192), (238, 123, 95, 255))
d = ImageDraw.Draw(img)
d.ellipse((36, 36, 156, 156), fill=(255, 250, 242, 255))
for name in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
    p = Path(f'android/app/src/main/res/mipmap-{name}')
    p.mkdir(parents=True, exist_ok=True)
    img.save(p / 'ic_launcher.png')
print('icons ok')
PY
          pip install -q 'gdown>=5.0' || true
          gdown "https://drive.google.com/uc?id=1lAyYjkTuMSnQmP_aqQL2vyL5vD3Xtlqm&export=download" -O /tmp/Junior-UI-source.zip || true
          if [ -s /tmp/Junior-UI-source.zip ]; then
            unzip -qo /tmp/Junior-UI-source.zip -d /tmp/junior_src
            if [ -f /tmp/junior_src/junior-ui/preview/demo.html ]; then
              cp -f /tmp/junior_src/junior-ui/preview/demo.html assets/junior/index.html
            elif [ -f /tmp/junior_src/junior-ui/preview/index.html ]; then
              cp -f /tmp/junior_src/junior-ui/preview/index.html assets/junior/index.html
            fi
          fi
          wc -c assets/junior/index.html

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target lib/main.dart --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Collect APK
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp -v {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist 2>/dev/null)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bee-plus-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
