name: Build Bee Plus APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Icons + Junior preview pack
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi assets/junior assets/junior_notes
          python3 - << 'PY'
from pathlib import Path
try:
    from PIL import Image, ImageDraw
except ImportError:
    import subprocess, sys
    subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', 'pillow'])
    from PIL import Image, ImageDraw
img = Image.new('RGBA', (192, 192), (238, 123, 95, 255))
d = ImageDraw.Draw(img)
d.ellipse((36, 36, 156, 156), fill=(255, 250, 242, 255))
for name in ('mdpi', 'hdpi', 'xhdpi', 'xxhdpi', 'xxxhdpi'):
    p = Path(f'android/app/src/main/res/mipmap-{name}')
    p.mkdir(parents=True, exist_ok=True)
    img.save(p / 'ic_launcher.png')
print('icons ok')
PY
          pip install -q 'gdown>=5.0'
          gdown "https://drive.google.com/uc?id=1mGLL8a0-WcWx26XHJv1h0wsy7G-_MGWh&export=download" -O /tmp/junior_latest.zip
          ls -lh /tmp/junior_latest.zip
          test -s /tmp/junior_latest.zip
          unzip -qo /tmp/junior_latest.zip -d /tmp/junior_pack
          if [ -f /tmp/junior_pack/Junior-preview-latest.html ]; then
            cp -f /tmp/junior_pack/Junior-preview-latest.html assets/junior/index.html
          else
            find /tmp/junior_pack -name 'Junior-preview*.html' -o -name 'index.html'
            exit 1
          fi
          if [ -d /tmp/junior_pack/notes ]; then
            cp -a /tmp/junior_pack/notes/. assets/junior_notes/ || true
          fi
          wc -c assets/junior/index.html
          test $(wc -c < assets/junior/index.html) -gt 1000000

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target lib/main.dart --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Collect APK
        run: |
          mkdir -p dist
          find build/app/outputs/flutter-apk -name '*.apk' -exec cp -v {} dist/ \;
          ls -lh dist/
          test -n "$(ls -A dist 2>/dev/null)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bee-plus-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
